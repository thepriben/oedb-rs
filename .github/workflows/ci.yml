name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Tests (schéma, DATEX, curation, issues)
        run: cargo test --locked
      - name: Build offline (fumée)
        run: OEDB_OFFLINE=1 cargo run --locked --release -- --out dist
